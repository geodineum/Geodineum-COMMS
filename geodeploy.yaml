runtime:
  # owner resolved from GEODEPLOY_DEPLOY_USER / DEPLOY_USER /
  # /etc/geodineum/deploy.env.
  # group is the dedicated COMMS runtime group — was
  # gnode, which made every deploy chown the tree back to deploy:gnode
  # and strip the geodineum-comms daemon's read access.
  group: geodineum-comms
  service: geodineum-comms

triggers:
  - match: "src/**|Cargo*"
    actions: [build, restart]
  # The unit file lived in this repo but nothing deployed it: a change to
  # config/*.service sat in git while /etc/systemd/system kept the old copy,
  # so unit fixes only landed when an operator remembered to copy them by hand.
  # `service-install`, hyphenated: that is the action name the dispatcher
  # registers. The underscore form is the internal FUNCTION name and is
  # rejected with "WARN unknown action".
  - match: "config/*.service"
    actions: [service-install, restart]
  # Templates load at startup only; a pulled template change without a
  # restart keeps serving the old rendering — invisibly, since the daemon
  # logs nothing about it.
  - match: "config/templates/**"
    actions: [restart]

build:
  type: cargo

dirty-tree:
  strategy: discard

cli:
  commands:
    - name: comms contract
      handler: scripts/cli/comms-contract.sh
      description: Print the COMMS integration contract (stream key, message format, env gating)
      category: COMMS
    - name: comms status
      handler: scripts/cli/comms-status.sh
      description: Show COMMS daemon status and stream counts
      category: COMMS
    - name: comms test-send
      handler: scripts/cli/comms-test-send.sh
      description: Send a test notification to a site
      requires_sudo: true
      category: COMMS
