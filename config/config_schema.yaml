# Geodineum-COMMS — config_schema
#
# Component name matches the stream-contract publisher (`geodineum_comms`).
# Published via geodineum_schema::publish_config_schema_sync on startup.

component: geodineum_comms
entries:
  - key: GEODINEUM_COMMS_DATA_DIR
    type: path
    default: /var/lib/geodineum-comms
    mutable: false
    description: Persistent data root (per-site SQLite message DBs, retry queue). Matches the binary default (src/main.rs::get_data_dir) and the unit's ReadWritePaths.

  - key: COMMS_INBOUND_SITE
    type: string
    default: geodineum
    mutable: true
    description: The Geodineum bot's site (its inbound stream and its Telegram channel in {site}:comms:config).

  - key: COMMS_ADMIN_IDS
    type: string
    default: ""
    mutable: true
    description: >-
      Comma-separated Telegram user IDs of the operators the bot answers;
      unset or empty, it answers nobody.

  - key: COMMS_TELEGRAM_API
    type: string
    default: https://api.telegram.org
    mutable: false
    description: Bot API base URL; a proof points it at a fake server.

  - key: TELEGRAM_BOT_TOKEN
    type: string
    default: ""
    mutable: false
    capability: manage_options
    description: >-
      Telegram bot token. Typically loaded from /etc/geodineum/credentials/
      rather than set via the wp-admin panel; present here for
      self-documentation only. Rotation happens via credential file.
