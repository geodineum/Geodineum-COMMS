# Apache2 configuration for Geodineum-COMMS
#
# This config sets up a reverse proxy for the Geodineum-COMMS daemon API
# with basic authentication and SSL termination.
#
# Prerequisites:
#   sudo a2enmod proxy proxy_http ssl headers rewrite auth_basic
#
# Usage:
#   1. Copy this file to /etc/apache2/sites-available/geodineum-comms.conf
#   2. Create htpasswd file: htpasswd -c /etc/apache2/.htpasswd-gnode admin
#   3. Update DNS: A record for comms.example.com -> your server IP
#   4. Obtain SSL cert: certbot --apache -d comms.example.com
#   5. Enable site: a2ensite geodineum-comms
#   6. Reload: apachectl configtest && systemctl reload apache2

# HTTP -> HTTPS redirect
<VirtualHost *:80>
    ServerName comms.example.com
    ServerAlias comms-alias.example.com

    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # Let's Encrypt challenge
    <Directory /var/www/certbot>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
</VirtualHost>

# Main HTTPS server
<VirtualHost *:443>
    ServerName comms.example.com
    ServerAlias comms-alias.example.com
    ServerAdmin webmaster@example.com

    # SSL Configuration (managed by certbot)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/comms.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/comms.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/geodineum-comms-error.log
    CustomLog ${APACHE_LOG_DIR}/geodineum-comms-access.log combined

    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests Off

    # Pass real client IP to backend
    RemoteIPHeader X-Forwarded-For
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"

    # Health check endpoint (no auth required)
    <Location /api/health>
        ProxyPass http://127.0.0.1:8080/api/health
        ProxyPassReverse http://127.0.0.1:8080/api/health
        Require all granted
    </Location>

    # API endpoints (require authentication)
    <Location /api>
        AuthType Basic
        AuthName "Geodineum-COMMS API"
        AuthUserFile /etc/apache2/.htpasswd-gnode
        Require valid-user

        ProxyPass http://127.0.0.1:8080/api
        ProxyPassReverse http://127.0.0.1:8080/api
    </Location>

    # Dashboard (require authentication)
    <Location />
        AuthType Basic
        AuthName "Geodineum-COMMS Dashboard"
        AuthUserFile /etc/apache2/.htpasswd-gnode
        Require valid-user

        ProxyPass http://127.0.0.1:8080/
        ProxyPassReverse http://127.0.0.1:8080/
    </Location>

    # Allow WordPress servers to access API without browser auth
    # Uncomment and add your WordPress server IPs
    # <Location /api>
    #     <RequireAny>
    #         Require ip 192.168.1.100
    #         Require ip 10.0.0.0/8
    #         Require valid-user
    #     </RequireAny>
    #     ProxyPass http://127.0.0.1:8080/api
    #     ProxyPassReverse http://127.0.0.1:8080/api
    # </Location>

    # Rate limiting (requires mod_ratelimit)
    # <Location /api/messages>
    #     SetOutputFilter RATE_LIMIT
    #     SetEnv rate-limit 500
    # </Location>
</VirtualHost>

# Alternative: Internal-only access (localhost only)
# Use this if you don't need public access
#
# <VirtualHost 127.0.0.1:8081>
#     ServerName localhost
#     ProxyPreserveHost On
#     ProxyPass / http://127.0.0.1:8080/
#     ProxyPassReverse / http://127.0.0.1:8080/
# </VirtualHost>
