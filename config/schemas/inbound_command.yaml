contract:
  name: inbound_command
  component: geodineum_comms
  version: "1.0.0"
  stability: stable
  stream: "{component}:gnode:comms:inbound:{env}"
  consumer_group: null
  purpose: >
    Operator command routed to a component via reply-correlation. COMMS writes
    to the component's callback_stream when an operator replies to an interactive
    alert (e.g., QUARANTINE, DISMISS, RETRY).

  fields:
    - name: command
      type: string
      required: true
      description: "Operator command (uppercase): QUARANTINE, DISMISS, RETRY, UPDATE, etc."
      example: "QUARANTINE"

    - name: context_id
      type: string
      required: true
      description: "Context ID linking this reply to the original alert"
      example: "ctx-001"

    - name: component
      type: string
      required: true
      description: "Target component name"
      example: "alerting"

    - name: operator_id
      type: string
      required: true
      description: "Telegram user ID of the operator"
      example: "7135101385"

    - name: operator_name
      type: string
      required: false
      description: "Operator display name"
      example: "Niels"

    - name: channel_source
      type: string
      required: true
      description: "Channel the reply came from"
      example: "telegram"
      values: "telegram|discord|email|sms"

    - name: ts
      type: iso8601
      required: true
      description: "ISO-8601 timestamp of the reply"
      example: "2026-04-15T15:51:00Z"

  xadd_example: >
    XADD alerting:gnode:comms:inbound:production *
    command QUARANTINE
    context_id ctx-001
    component alerting
    operator_id 7135101385
    operator_name Niels
    channel_source telegram
    ts 2026-04-15T15:51:00Z
