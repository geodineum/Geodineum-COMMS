# Nginx configuration for Geodineum-COMMS
#
# This config sets up a reverse proxy for the Geodineum-COMMS daemon API
# with basic authentication and optional SSL termination.
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/geodineum-comms
#   2. Create symlink: ln -s /etc/nginx/sites-available/geodineum-comms /etc/nginx/sites-enabled/geodineum-comms
#   3. Create htpasswd file: htpasswd -c /etc/nginx/.htpasswd-gnode admin
#   4. Update DNS: A record for comms.example.com -> your server IP
#   5. Obtain SSL cert: certbot --nginx -d comms.example.com
#   6. Reload nginx: nginx -t && systemctl reload nginx

# Upstream for Geodineum-COMMS daemon
upstream geodineum_comms {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name comms.example.com;

    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name comms.example.com;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/comms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comms.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/geodineum-comms.access.log;
    error_log /var/log/nginx/geodineum-comms.error.log;

    # Health check endpoint (no auth required)
    location /api/health {
        proxy_pass http://geodineum_comms;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints (require authentication)
    location /api/ {
        auth_basic "Geodineum-COMMS API";
        auth_basic_user_file /etc/nginx/.htpasswd-gnode;

        proxy_pass http://geodineum_comms;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # For WordPress admin to call API
        # Add your WordPress server IPs here to allow without auth
        # satisfy any;
        # allow 192.168.1.100;  # WordPress server
        # deny all;
    }

    # Dashboard (require authentication)
    location / {
        auth_basic "Geodineum-COMMS Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd-gnode;

        proxy_pass http://geodineum_comms;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=geodineum_api:10m rate=10r/s;
    location ~ ^/api/(messages|stats) {
        limit_req zone=geodineum_api burst=20 nodelay;

        auth_basic "Geodineum-COMMS API";
        auth_basic_user_file /etc/nginx/.htpasswd-gnode;

        proxy_pass http://geodineum_comms;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Alternative: Internal-only access (no public internet)
# Uncomment this and comment out the main server block above
