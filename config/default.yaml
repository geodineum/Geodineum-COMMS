# Geodineum-COMMS Default Configuration
# Copy to config/local.yaml and customize for your environment

valkey:
  host: 127.0.0.1
  port: 47445
  user: geodineum_comms
  # password: set via VALKEY_AUTH env var or CLI flag

consumer:
  # How long to block waiting for messages (ms)
  block_ms: 5000
  # Maximum messages per batch
  batch_size: 100
  # Claim messages idle longer than this (ms)
  idle_claim_ms: 30000
  # How often to discover new sites (seconds)
  discovery_interval_secs: 60

retry:
  # Maximum retry attempts before giving up
  max_attempts: 5
  # Base delay for exponential backoff (seconds)
  base_delay_secs: 30
  # Maximum delay between retries (seconds)
  max_delay_secs: 3600

spam_filter:
  # The daemon-wide filter for every site that has no filter of its own: spam from visitors is held in the
  # archive (status spam), never sent; `geodineum-comms messages <site> --status spam` lists it
  enabled: true
  # Keywords to block (case insensitive)
  keywords_blocklist:
    - viagra
    - casino
    - crypto investment
  # IP addresses to block
  ip_blocklist: []

# ── Inbound: the Geodineum bot (operators only) ──────────────────────
# Alerts, grant requests, polls and /status for the operators; conversations are GeodineBot's (Geodine).
#
# Secrets should be supplied via the env file (NOT this YAML), which lives at:
#   /etc/geodineum/components/geodineum-comms/geodineum-comms.env
#
# Supported env vars (override any YAML values):
#   TELEGRAM_BOT_TOKEN        — bot token from @BotFather
#   COMMS_INBOUND_SITE        — the bot's site (default: geodineum)
#   COMMS_ADMIN_IDS           — the operators' Telegram user IDs (unset: the bot answers nobody)
#   COMMS_TELEGRAM_API        — Bot API base URL (default https://api.telegram.org; proofs point it at a fake)
#
# Inbound activates automatically when TELEGRAM_BOT_TOKEN is set. This YAML
# section is optional — it exists only to document non-secret defaults.
#
# inbound:
#   site_id: geodineum
