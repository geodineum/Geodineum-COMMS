[package]
name = "gsd-comms"
version = "0.1.0"
edition = "2021"
authors = ["Geodineum Team"]
description = "Notification daemon for GSD - dispatches notifications via email, Telegram, and SMS"
license = "MIT"
repository = "https://github.com/nierto/GSD-COMMS"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ValKey/Redis client
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Web framework (admin dashboard)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "fs"] }
tower-sessions = "0.12"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "pool"] }

# HTTP client (for Telegram/Twilio APIs)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Templates
tera = "1.19"

# Encryption
ring = "0.17"
base64 = "0.21"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
once_cell = "1.19"
parking_lot = "0.12"
rand = "0.8"
hostname = "0.4"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
wiremock = "0.5"
tempfile = "3.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "gsd-comms"
path = "src/main.rs"
