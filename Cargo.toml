[package]
name = "geodineum-comms"
version = "0.1.0"
edition = "2021"
authors = ["Geodineum Team"]
description = "Geodineum notification daemon - dispatches notifications via email, Telegram, and SMS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/geodineum/Geodineum-COMMS"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ValKey/Redis client
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# SQLite for persistent message archive
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2_sqlite = "0.24"
r2d2 = "0.8"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "pool"] }

# HTTP client (for Telegram/Twilio APIs)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Templates
tera = "1.19"

# Encryption

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
once_cell = "1.19"
parking_lot = "0.12"
rand = "0.8"
hostname = "0.4"
regex = "1.10"
tokio-util = "0.7"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Schema publication (ships with Geodineum installer repo)
geodineum-schema = { path = "../Geodineum/lib/geodineum-schema" }

# Validation

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
wiremock = "0.5"
tempfile = "3.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "geodineum-comms"
path = "src/main.rs"
